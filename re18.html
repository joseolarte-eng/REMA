

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa del camión recolector - REMA</title>
    <link rel="stylesheet" href="re18.css">
</head>
<body>

    <main class="mapa-seccion">

        <h1>Mapa del camión recolector</h1>

        <p>
            Conoce el recorrido del camión recolector de residuos
            en la ciudad.
        </p>

        <section class="mapa">

            <!-- Edificios del mapa -->
            <div class="edificio edificio-1"></div>
            <div class="edificio edificio-2"></div>
            <div class="edificio edificio-3"></div>
            <div class="edificio edificio-4"></div>

            <!-- Nombres de las calles -->
            <span class="nombre-calle calle-america">
                Av. América
            </span>

            <span class="nombre-calle calle-pando">
                Calle Pando
            </span>

            <!-- Calle donde circula el camión -->
            <div class="calle-camion">

                <!-- Recorrido del camión -->
                <div class="ruta"></div>

                <!-- Icono del camión recolector -->
                <div class="camion" id="camion"
                     style="position: absolute; left: 20%; top: 50%; transform: translate(-50%, -50%);">
                    🚛
                </div>

            </div>

            <!-- Marcador del contenedor cercano -->
            <div class="marcador-contenedor"
                 title="Contenedor cercano">
                🗑️
            </div>

        </section>

        <!-- Información de ubicación -->
        <section class="informacion-ubicacion">

            <p id="estado-ubicacion">
                Ubicación del camión: posición inicial.
            </p>

            <button type="button" id="btn-actualizar">
                Actualizar ubicación
            </button>

        </section>

    </main>

    <script>
        // Posiciones de ejemplo del camión sobre la ruta
        const posiciones = [20, 40, 60, 80];

        let posicionActual = 0;

        const camion = document.getElementById("camion");
        const estado = document.getElementById("estado-ubicacion");
        const boton = document.getElementById("btn-actualizar");

        function actualizarUbicacion() {

            // Avanzar a la siguiente posición
            posicionActual++;

            if (posicionActual >= posiciones.length) {
                posicionActual = 0;
            }

            // Cambiar la ubicación visual del camión
            camion.style.left = posiciones[posicionActual] + "%";

            // Mostrar el estado actualizado
            estado.textContent =
                "Ubicación del camión: posición " +
                (posicionActual + 1) +
                " del recorrido (simulación).";
        }

        // Ejecutar la actualización al presionar el botón
        boton.addEventListener("click", actualizarUbicacion);
    </script>

</body>
</html>
