<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de contenedores cercanos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="app">
  <header class="app-header">
    <h1>Mapa de contenedores cercanos</h1>
  </header>

  <section class="map-wrapper" aria-label="Mapa de contenedores">
    <img id="map-image" src="Captura de pantalla 2026-11-21 121222.png" alt="Mapa de contenedores cercanos: Av. Ayacucho, Gral. Acha, Santivañez y Nataniel Aguirre">
    <div id="map-markers" class="map-markers"></div>
  </section>

  <section id="containers-list" class="containers-list" aria-label="Contenedores cercanos">
    <article class="container-card" data-id="1">
      <div class="container-photo" role="img" aria-label="Foto del contenedor"></div>
      <div class="container-info">
        <h3>Contenedor Av. Ayacucho</h3>
        <p class="status status--medium"><span class="status-dot"></span>Medio Lleno</p>
        <p class="waste-types">Organicos, Reciclables</p>
      </div>
      <span class="distance">50m</span>
    </article>

    <article class="container-card" data-id="2">
      <div class="container-photo" role="img" aria-label="Foto del contenedor"></div>
      <div class="container-info">
        <h3>Contenedor Av. Ayacucho</h3>
        <p class="status status--full"><span class="status-dot"></span>Lleno</p>
        <p class="waste-types">Organicos, Reciclables</p>
      </div>
      <span class="distance">150m</span>
    </article>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
