<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RE11</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="prototipo-seccion">
      <!-- Titulo -->
      <h2 class="prototipo-titulo">Prueba el Prototipo de App Móvil de REMA</h2>
      <!-- Contenedores -->
      <div class="prototipo-contenedor">
        <div class="telefono-visual">
          <img
            src="https://res.cloudinary.com/v2j4dgzz/image/upload/v1795216435/Group_56.png"
            alt=""
            class="telefono-img"
          />
        </div>
      </div>
      <div class="prototipo-rapida">
        <h3 class="prototipo-h3">Mas sencilla y rapida</h3>
        <p class="protoitpo-parrafo">
          Consulta cuándo se aproxima el camión recolector y organiza mejor el
          momento para sacar tus residuos.
        </p>
        <img
          src="https://res.cloudinary.com/v2j4dgzz/image/upload/v1795216742/Capa_1.png"
          alt=""
          class="protoitpo-basura"
        />
      </div>
      <div class="prototipo-acumulacion">
        <h3 class="prototipo-h3">Evita la acumulación</h3>
        <p class="protoitpo-parrafo">
          Consulta cuándo se aproxima el camión recolector y organiza mejor el
          momento para sacar tus residuos.
        </p>
        <img
          src="https://res.cloudinary.com/v2j4dgzz/image/upload/v1795216742/Capa_1.png"
          alt=""
          class="protoitpo-basura"
        />
      </div>
      <div class="prototipo-figma">
        <a
          href="https://www.figma.com"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-figma"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 38 57"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M19 28.5A9.5 9.5 0 1 1 28.5 19 9.5 9.5 0 0 1 19 28.5Z"
              fill="#1ABCFE"
            />
            <path
              d="M9.5 47.5A9.5 9.5 0 0 1 19 38v9.5a9.5 9.5 0 0 1-9.5 0Z"
              fill="#0ACF83"
            />
            <path d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19Z" fill="#FF7262" />
            <path
              d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5Z"
              fill="#F24E1E"
            />
            <path
              d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5Z"
              fill="#A259FF"
            />
          </svg>
          <span>Figma</span>
        </a>
      </div>
    </section>
  </body>
</html>
